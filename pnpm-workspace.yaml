blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - rolldown-plugin-dts@0.27.4
  - typescript@7.0.2
  - "@typescript/*"
  - atom.io
  - break-check@0.6.40
  - comline@0.6.3
  - recoverage
  - tonnage
autoInstallPeers: false
hoist: false
verifyDepsBeforeRun: error

overrides:
  rolldown-plugin-dts: 0.28.6

packageExtensions:
  # https://github.com/jeremybanka/atom.io/issues/966
  atom.io@0.53.1:
    peerDependencies:
      "@types/react": ^18.0.0 || ^19.0.0
    peerDependenciesMeta:
      "@types/react":
        optional: true
  # https://github.com/oven-sh/bun/issues/22805
  bun-types@1.4.2:
    dependencies:
      undici-types: 8.9.0
  # https://github.com/pmndrs/tunnel-rat/issues/24
  tunnel-rat@0.1.2:
    peerDependencies:
      react: ^18.0.0 || ^19.0.0

packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@swc/core": true
  dprint: true
  "esbuild": true
  "rolldown": true
  "sharp": true
  "unrs-resolver": true
  "workerd": true

peerDependencyRules:
  allowedVersions:
    typescript: ^5.0.0 || ^6.0.0 || ^7.0.0
