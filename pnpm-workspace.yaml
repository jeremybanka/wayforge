blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Consumed jeremybanka packages are exempt at every version.
  # Keep aligned with the npm rule in renovate.json.
  - "@correctlyjs/schemars"
  - "@atom.io/eslint-plugin"
  - "@atom.io/react"
  - "@atom.io/react-devtools"
  - "@atom.io/realtime"
  - atom.io
  - breakage
  - comline
  - correctly
  - galley.md
  - lasertag
  - recoverage
  - takua
  - tonnage
  - treetrunks

autoInstallPeers: false
hoist: false
verifyDepsBeforeRun: error

overrides:
  rolldown-plugin-dts: 0.28.8

packageExtensions:
  # https://github.com/jeremybanka/atom.io/issues/966
  atom.io@0.53.1:
    peerDependencies:
      "@types/react": ^18.0.0 || ^19.0.0
    peerDependenciesMeta:
      "@types/react":
        optional: true
  # https://github.com/oven-sh/bun/issues/22805
  bun-types@1.4.2:
    dependencies:
      undici-types: 8.9.0
  # https://github.com/pmndrs/tunnel-rat/issues/24
  tunnel-rat@0.1.2:
    peerDependencies:
      react: ^18.0.0 || ^19.0.0

packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@swc/core": true
  "@vscode/vsce-sign": true
  dprint: true
  "esbuild": true
  "rolldown": true
  "sharp": true
  "unrs-resolver": true
  "workerd": true

peerDependencyRules:
  allowedVersions:
    typescript: ^5.0.0 || ^6.0.0 || ^7.0.0
