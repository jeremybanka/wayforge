blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Temporary Bun exceptions; remove after 2026-10-23 10:20 UTC.
  # Keep aligned with the temporary rules in renovate.json.
  - bun@1.4.4
  - "@oven/bun-darwin-aarch64@1.4.4"
  - "@oven/bun-darwin-x64@1.4.4"
  - "@oven/bun-freebsd-aarch64@1.4.4"
  - "@oven/bun-freebsd-x64@1.4.4"
  - "@oven/bun-linux-aarch64@1.4.4"
  - "@oven/bun-linux-aarch64-android@1.4.4"
  - "@oven/bun-linux-aarch64-musl@1.4.4"
  - "@oven/bun-linux-x64@1.4.4"
  - "@oven/bun-linux-x64-android@1.4.4"
  - "@oven/bun-linux-x64-musl@1.4.4"
  - "@oven/bun-windows-aarch64@1.4.4"
  - "@oven/bun-windows-x64@1.4.4"
  - bun-types@1.4.4
  - "@types/bun@1.4.3"
  # Permit the verified eMudhra security patch before the usual release-age delay.
  - dprint@0.64.1
  - "@dprint/android-arm64@0.64.1"
  - "@dprint/android-x64@0.64.1"
  - "@dprint/darwin-arm64@0.64.1"
  - "@dprint/darwin-x64@0.64.1"
  - "@dprint/freebsd-arm64@0.64.1"
  - "@dprint/freebsd-x64@0.64.1"
  - "@dprint/linux-arm64-glibc@0.64.1"
  - "@dprint/linux-arm64-musl@0.64.1"
  - "@dprint/linux-loong64-glibc@0.64.1"
  - "@dprint/linux-loong64-musl@0.64.1"
  - "@dprint/linux-ppc64-glibc@0.64.1"
  - "@dprint/linux-ppc64-musl@0.64.1"
  - "@dprint/linux-riscv64-glibc@0.64.1"
  - "@dprint/linux-riscv64-musl@0.64.1"
  - "@dprint/linux-s390x-glibc@0.64.1"
  - "@dprint/linux-x64-glibc@0.64.1"
  - "@dprint/linux-x64-musl@0.64.1"
  - "@dprint/win32-arm64@0.64.1"
  - "@dprint/win32-x64@0.64.1"
  - rolldown-plugin-dts@0.27.4
  - typescript@7.0.2
  - "@typescript/*"
  # Packages authored by jeremybanka are exempt at every version.
  # Keep this list aligned with the corresponding rule in renovate.json.
  - atom.io
  - break-check
  - breakage
  - comline
  - flightdeck
  - galley.md
  - jurist
  - lasertag
  - luum
  - rationality
  - recoverage
  - rel8
  - safedeposit
  - takua
  - tonnage
  - treetrunks
  - tsdoc.json
  - varmint
  - venerate
autoInstallPeers: false
hoist: false
verifyDepsBeforeRun: error

overrides:
  rolldown-plugin-dts: 0.28.8

packageExtensions:
  # https://github.com/jeremybanka/atom.io/issues/966
  atom.io@0.53.1:
    peerDependencies:
      "@types/react": ^18.0.0 || ^19.0.0
    peerDependenciesMeta:
      "@types/react":
        optional: true
  # https://github.com/oven-sh/bun/issues/22805
  bun-types@1.4.2:
    dependencies:
      undici-types: 8.9.0
  # https://github.com/pmndrs/tunnel-rat/issues/24
  tunnel-rat@0.1.2:
    peerDependencies:
      react: ^18.0.0 || ^19.0.0

packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@swc/core": true
  "@vscode/vsce-sign": true
  dprint: true
  "esbuild": true
  "rolldown": true
  "sharp": true
  "unrs-resolver": true
  "workerd": true

peerDependencyRules:
  allowedVersions:
    typescript: ^5.0.0 || ^6.0.0 || ^7.0.0
