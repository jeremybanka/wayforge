name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_REMOTE_CACHE_URL: ${{ secrets.PNPM_REMOTE_CACHE_URL || secrets.TURBO_API }}
  PNPM_REMOTE_CACHE_TEAM: ${{ vars.PNPM_REMOTE_CACHE_TEAM || vars.TURBO_TEAMID }}
  PNPM_REMOTE_CACHE_ORG: wayforge
  PNPM_REMOTE_CACHE_TOKEN: ${{ secrets.PNPM_REMOTE_CACHE_TOKEN || secrets.TURBO_TOKEN }}
  PNPM_REMOTE_CACHE_TRUSTED_KEYS: ${{ vars.PNPM_REMOTE_CACHE_TRUSTED_KEYS }}
  PNPM_REMOTE_CACHE_PRIVATE_KEY: ${{ secrets.PNPM_REMOTE_CACHE_PRIVATE_KEY }}
  PNPM_REMOTE_CACHE_KEY_ID: ci
  PNPM_REMOTE_CACHE_BUILDER_ID: github-actions
  PNPM_REMOTE_CACHE_PUBLISH: ${{ secrets.PNPM_REMOTE_CACHE_PRIVATE_KEY != '' }}

defaults:
  run:
    shell: bash

jobs:
  Vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:18.4-alpine3.23
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: your_password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 1s --health-timeout 0.5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages: bun node pnpm aqua:nushell/nushell carapace conda:zsh go github:fish-shell/fish-shell github:scop/bash-completion
      - run: pnpm run test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: Varmint
          path: /tmp/varmint-uploads
          retention-days: 1

  Build:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run build

  Tonnage:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm check:tonnage

  Coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:18.4-alpine3.23
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: your_password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 1s --health-timeout 0.5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages: bun node pnpm aqua:nushell/nushell carapace conda:zsh go github:fish-shell/fish-shell github:scop/bash-completion
      - run: git rev-parse HEAD > git.sha
      - run: pnpm cov:check
        env:
          RECOVERAGE_CLOUD_TOKEN: ${{ secrets.RECOVERAGE_CLOUD_TOKEN }}

  Breakage:
    name: Breakage
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:18.4-alpine3.23
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: your_password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 1s --health-timeout 0.5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages: bun node pnpm aqua:nushell/nushell carapace conda:zsh go github:fish-shell/fish-shell github:scop/bash-completion
      - run: pnpm test:breakage
