name: Renovate

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  discoverUpgrades:
    name: Discover Upgrades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: jeremybanka
          repositories: wayforge
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-statuses: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: renovatebot/github-action@6d26fcf0275dc65624cbc3d51fe78bc773f98321 # v46.3.6
        env:
          LOG_LEVEL: debug
          RENOVATE_ALLOWED_COMMANDS: '["^pnpm install --frozen-lockfile$", "^pnpm tonnage:write$"]'
          RENOVATE_ALLOW_SCRIPTS: "true"
          RENOVATE_ALLOW_PLUGINS: true
          RENOVATE_REPOSITORIES: jeremybanka/wayforge
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}
