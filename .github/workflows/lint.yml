name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_REMOTE_CACHE_URL: ${{ secrets.PNPM_REMOTE_CACHE_URL || secrets.TURBO_API }}
  PNPM_REMOTE_CACHE_TEAM: ${{ vars.PNPM_REMOTE_CACHE_TEAM || vars.TURBO_TEAMID }}
  PNPM_REMOTE_CACHE_ORG: wayforge
  PNPM_REMOTE_CACHE_TOKEN: ${{ secrets.PNPM_REMOTE_CACHE_TOKEN || secrets.TURBO_TOKEN }}
  PNPM_REMOTE_CACHE_TRUSTED_KEYS: ${{ vars.PNPM_REMOTE_CACHE_TRUSTED_KEYS }}
  PNPM_REMOTE_CACHE_PRIVATE_KEY: ${{ secrets.PNPM_REMOTE_CACHE_PRIVATE_KEY }}
  PNPM_REMOTE_CACHE_KEY_ID: ci
  PNPM_REMOTE_CACHE_BUILDER_ID: github-actions
  PNPM_REMOTE_CACHE_PUBLISH: ${{ github.event_name == 'push' && secrets.PNPM_REMOTE_CACHE_PRIVATE_KEY != '' }}

defaults:
  run:
    shell: bash

jobs:
  Dprint:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm check:fmt

  Dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm check:deps

  ESLint:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm check:eslint

  Oxlint:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm check:oxlint

  Types:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm check:tsc

  Lasertag:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm check:lasertag
