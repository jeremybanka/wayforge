name: Review

on:
  pull_request:
  issue_comment:

jobs:
  ExplainCode:
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    name: Explain Code
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: Codium
        id: codium-pr-agent
        uses: docker://codiumai/pr-agent@sha256:c8112ac5d6ac958530d9f0002c3faa602020904c7ffbb0d1cc25dc91c898080f # 0.34-github_action
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
