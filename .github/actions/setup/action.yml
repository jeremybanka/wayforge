name: Setup
description: Download and install 3rd party software.
inputs:
  packages:
    description: Space-separated mise packages to install for this job.
    required: false
    default: bun node pnpm
runs:
  using: composite
  steps:
    - name: Install Mise
      uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      with:
        version: 2026.10.17
        env: false
        install_args: ${{ inputs.packages }}

    - name: Install Dependencies
      shell: bash
      run: pnpm i --frozen-lockfile

    - name: Configure Git
      shell: bash
      run: |
        git config --global init.defaultBranch main
        git config --global user.email "you@example.com"
        git config --global user.name "Your Name"
