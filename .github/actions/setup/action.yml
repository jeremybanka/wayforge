name: Setup
description: Download and install 3rd party software.
inputs:
  packages:
    description: Space-separated mise packages to install for this job.
    required: false
    default: bun node pnpm
runs:
  using: composite
  steps:
    - name: Install Mise
      uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      with:
        version: 2026.10.25
        env: false
        install_args: ${{ inputs.packages }}

    - name: Install Dependencies
      shell: bash
      run: pnpm i --frozen-lockfile

    - name: Configure Git
      shell: bash
      run: |
        git config --global init.defaultBranch main
        git config --global user.email "you@example.com"
        git config --global user.name "Your Name"
